name: Firmware & Web-Flasher

# Baut die ESP32-S3-Firmware, veröffentlicht den Web-Flasher (ESP Web Tools) auf GitHub Pages
# und hängt die .bin-Dateien an Releases an.
# Einmalig nötig: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [master]
    paths: ["esp32-bridge/**", "webflash/**", "webble/**", ".github/workflows/firmware.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FQBN: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,CDCOnBoot=cdc
  CORE: "3.0.7"
  INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: ESP32-Core installieren
        run: |
          arduino-cli core update-index --additional-urls "$INDEX"
          arduino-cli core install "esp32:esp32@$CORE" --additional-urls "$INDEX"
      - name: Firmware bauen
        run: arduino-cli compile --fqbn "$FQBN" --export-binaries --output-dir build esp32-bridge/m18_bridge
      - name: Web-Flasher zusammenstellen
        run: |
          set -e
          ls -la build
          # akkuscan.app: portal (app) at the root, flasher under /flasher/, old /app/ links redirect to /
          mkdir -p site/flasher/firmware site/app
          cp webble/app.html site/index.html
          cp webble/manifest.webmanifest webble/icon.svg site/
          cp webflash/index.html site/flasher/
          cp webble/redirect.html site/app/index.html
          echo akkuscan.app > site/CNAME
          cp build/m18_bridge.ino.bin site/flasher/firmware/m18-bruecke-update.bin
          if [ -f build/m18_bridge.ino.merged.bin ]; then
            cp build/m18_bridge.ino.merged.bin site/flasher/firmware/m18-bruecke.bin
          else
            # Fallback: Bootloader + Partitionen + boot_app0 + App selbst zusammenfügen
            ESPTOOL=$(find ~/.arduino15/packages/esp32/tools -name 'esptool' -type f -perm -u+x | head -1)
            BOOTAPP=$(find ~/.arduino15/packages/esp32/hardware -name boot_app0.bin | head -1)
            "$ESPTOOL" --chip esp32s3 merge_bin -o site/flasher/firmware/m18-bruecke.bin --flash_mode keep --flash_size 16MB \
              0x0 build/m18_bridge.ino.bootloader.bin 0x8000 build/m18_bridge.ino.partitions.bin \
              0xe000 "$BOOTAPP" 0x10000 build/m18_bridge.ino.bin
          fi
          # Das Arduino-Image ist auf die vollen 16 MB aufgefüllt (fast nur 0xFF). Leere Bytes am Ende
          # abschneiden: Der Browser muss dann nur ~1,3 MB schreiben statt 16 MB (sonst steht er minutenlang bei 98 %).
          python3 - <<'PY'
          p = "site/flasher/firmware/m18-bruecke.bin"
          d = open(p, "rb").read()
          end = len(d.rstrip(b"\xff"))
          end = (end + 0xFFF) & ~0xFFF
          open(p, "wb").write(d[:end])
          print(f"Web-Flasher-Image: {len(d)} -> {end} Bytes")
          PY
          VERSION=$(grep -oP '#define M18BRIDGE_VERSION "\K[^"]+' esp32-bridge/m18_bridge/m18_proto.h)
          cat > site/flasher/manifest.json <<JSON
          {
            "name": "M18 Akku-Brücke",
            "version": "$VERSION",
            "build": "$(date -u +%Y-%m-%d) (${GITHUB_SHA::7})",
            "new_install_prompt_erase": true,
            "new_install_improv_wait_time": 0,
            "builds": [
              { "chipFamily": "ESP32-S3", "parts": [ { "path": "firmware/m18-bruecke.bin", "offset": 0 } ] }
            ]
          }
          JSON
          cat site/flasher/manifest.json
          ls -laR site
      - name: Image prüfen (Bootloader, Partitionen, App)
        run: |
          python3 - <<'PY'
          import struct, sys
          d = open("site/flasher/firmware/m18-bruecke.bin", "rb").read()
          app = open("site/flasher/firmware/m18-bruecke-update.bin", "rb").read()
          ok = True
          def check(cond, msg):
              global ok
              print(("OK   " if cond else "FAIL ") + msg)
              ok &= cond
          check(d[0] == 0xE9, "Bootloader-Kennung 0xE9 bei 0x0")
          check(d[0x8000:0x8002] == b"\xaa\x50", "Partitionstabelle bei 0x8000")
          parts = {}
          for i in range(0, 0xC00, 32):
              e = d[0x8000 + i:0x8000 + i + 32]
              if e[:2] != b"\xaa\x50":
                  break
              off, size = struct.unpack("<II", e[4:12])
              name = e[12:28].rstrip(b"\0").decode()
              parts[name] = (e[2], e[3], off, size)
              print(f"     {name:10} typ {e[2]} sub {e[3]:3} 0x{off:06x} {size // 1024} KB")
          check(any(t == 1 and st == 0x81 for t, st, _, _ in parts.values()), "FAT-Partition (Messungsspeicher) vorhanden")
          check(sum(1 for t, *_ in parts.values() if t == 0) >= 2, "zwei App-Partitionen (OTA)")
          check(d[0x10000:0x10000 + len(app)] == app, "App bei 0x10000 = Update-Datei")
          check(len(d) < 4 * 1024 * 1024, f"Image klein genug für schnelles Flashen ({len(d) // 1024} KB)")
          sys.exit(0 if ok else 1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m18-bruecke-firmware
          path: site/flasher/firmware/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: An das Release anhängen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" site/flasher/firmware/*.bin --clobber

  pages:
    needs: build
    runs-on: ubuntu-latest
    # schlägt fehl, solange GitHub Pages nicht auf "GitHub Actions" gestellt ist (siehe oben)
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
